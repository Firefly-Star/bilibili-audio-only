<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <style>
    body { width: 240px; margin: 0; padding: 14px 16px; font: 13px/1.6 -apple-system, "Microsoft YaHei", sans-serif; color: #222; }
    h1 { font-size: 14px; margin: 0 0 10px; }
    label { display: flex; align-items: center; gap: 8px; cursor: pointer; }
    input { width: 16px; height: 16px; }
    .hint { margin-top: 10px; color: #888; font-size: 12px; }
    code { background: #f4f4f4; border-radius: 3px; padding: 0 4px; }
  </style>
</head>
<body>
  <h1>B站 · 仅播放声音</h1>
  <label><input type="checkbox" id="on"> 启用（只拉音轨）</label>
  <div class="hint" id="hint">切换后页面会自动刷新一次。</div>
  <script src="popup.js"></script>
</body>
</html>
